# open-home-fm default configuration.
# Don't edit this file for your own settings: the web UI and installer store only the values you
# change in data/config.yaml (gitignored), which is laid over these defaults at runtime. That
# keeps updates conflict-free, and changed defaults reach every value you never touched.
# To change something by hand, copy just that key (with its parent keys) into data/config.yaml.

desks:
  # The music desk plans the program in blocks and appends them to the queue whenever the
  # program left runs low - there's no fixed interval any more.
  music:
    enabled: true
    # Plan the next block once less than this many minutes of program are queued.
    fill_threshold_minutes: 10
    # Length of one block.
    block_minutes: 20
    # Never queue more program than this (neither the fill trigger nor "run now").
    max_queued_program_minutes: 45
    # At most one announcement per this many songs, across block boundaries.
    songs_per_announcement: 3
    # Songs that went on air (or are already queued) within this many minutes are not planned again.
    no_repeat_minutes: 120
    # Max tool-call round-trips per run, guards against runaway loops. A longer block needs more
    # song lookups, so keep this well above the number of songs per block.
    max_tool_iterations: 20
    # Plugin tools this desk may call; context_plugins are fetched automatically into its input.
    plugins: [get_weather, get_favorite_songs, get_news_headlines]
    context_plugins: [get_weather]

schedule:
  # false (default) = always on air. true restricts generation + playback to the daily window
  # below (editable via the web UI). An end_time earlier than start_time spans midnight.
  enabled: false
  start_time: "06:00"
  end_time: "23:00"

llm:
  # "ollama" (local or Ollama Cloud) | "anthropic"
  provider: ollama
  ollama:
    model: "gpt-oss:120b-cloud"
    # Leave empty for a local Ollama daemon (http://localhost:11434).
    # Set to https://ollama.com for Ollama Cloud (needs OLLAMA_API_KEY in .env).
    host: "https://ollama.com"
  anthropic:
    model: "claude-sonnet-5"

music:
  # "spotify" | "local"
  provider: local
  spotify:
    # Spotify Connect device name exposed by raspotify (see /etc/raspotify/conf).
    device_name: "open-home-fm"
    # Playback volume (0-100) set whenever a track starts, keeps music and moderator balanced.
    # null leaves the device volume alone.
    volume_percent: 90
  local:
    library_path: "data/library"
  # Playlist ids (Spotify ids, or folder names under the local library): taste context for the
  # music desk and the last fallback of the filler program. Local source without favorites:
  # the filler plays from the whole library.
  favorite_playlists: []

audio:
  # ALSA/PulseAudio output sink that feeds the FM transmitter chain.
  # Both the local music provider and the jingle/TTS player write here.
  output_device: "default"
  jingle_cache_dir: "data/audio_cache"
  # Fade length for interruptions (used from Phase 4 on).
  fade_seconds: 2

tts:
  # "piper" (local) | "none"
  engine: piper
  piper:
    binary: "piper"
    voice_model: "models/tts/de_DE-thorsten-medium.onnx"
    # Everything below is also adjustable (with preview) in the web UI's "Stimme" card.
    # Speaker name for multi-speaker models (e.g. thorsten_emotional: "neutral"), else null.
    speaker: null
    # >1 speaks slower, <1 faster.
    length_scale: 1.0
    # Post-processing via ffmpeg: pitch shift in semitones (tempo stays) and reverb amount 0..1.
    pitch_semitones: 0
    echo: 0

stt:
  # "faster_whisper" (local) | "none"
  engine: faster_whisper
  faster_whisper:
    model_size: "small"
    device: "cpu"
    compute_type: "int8"

plugins:
  # Plugin folders under ./plugins are auto-discovered; individually disable here by name.
  # Hue is off until set up (scripts/setup_plugins.py hue pairs the bridge).
  disabled: [control_hue_lights]
  # Per-plugin settings written by the plugins' install() step (scripts/setup_plugins.py).
  settings: {}
