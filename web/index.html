<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open home fm · Sendung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Chivo+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="broadcast">
  <div class="wrap">
    <header class="console">
      <a class="wordmark" href="/index.html">open home<span>.fm</span></a>
      <nav class="tabs" aria-label="Bereiche">
        <a href="/index.html" aria-current="page">Sendung</a>
        <a href="/calls.html">Rufen</a>
        <a href="/desks.html">Redaktion</a>
        <a href="/settings.html">Technik</a>
      </nav>
      <div class="onair-status">
        <div class="lamp" id="lamp" data-state="unknown" role="status">
          <span class="dot" aria-hidden="true"></span>
          <span id="lamp-label">…</span>
        </div>
        <span class="clock" id="clock"></span>
      </div>
    </header>
    <div class="notices" id="notices" aria-live="polite"></div>

    <section class="dial" aria-label="Sendeplan heute">
      <div class="dial-track" id="dial-track"></div>
      <div class="dial-caption">
        <span id="dial-window">…</span>
        <span class="news-cap" id="dial-news" hidden></span>
        <span id="dial-program"></span>
      </div>
    </section>

    <main class="studio">
      <div class="col">
        <section class="display" id="onair" data-state="idle" aria-labelledby="h-onair">
          <div class="card-head">
            <h2 id="h-onair">Jetzt auf Sendung</h2>
            <span class="meta" id="onair-mode"></span>
          </div>
          <div class="now-chips" id="now-chips"></div>
          <p class="now-title" id="now-title">…</p>
          <blockquote class="moderation" id="now-text" hidden></blockquote>
          <div id="progress-wrap" hidden>
            <div class="progress" aria-hidden="true"><div class="bar" id="progress-bar"></div></div>
            <div class="progress-times">
              <span id="progress-pos">0:00</span>
              <span id="progress-dur"></span>
            </div>
          </div>
          <p class="state-line" id="state-line" hidden></p>
          <div class="display-foot">
            <button class="btn ghost" id="skip" type="button" disabled>Song überspringen</button>
            <span class="note" id="skip-note" role="status"></span>
          </div>
        </section>

        <section class="display" aria-labelledby="h-next">
          <div class="card-head">
            <h2 id="h-next">Als Nächstes</h2>
            <span class="meta" id="next-meta"></span>
          </div>
          <ol class="next-list" id="next-list"></ol>
          <div class="undo" id="undo" hidden>
            <span class="text" id="undo-text" role="status"></span>
            <button class="btn small" id="undo-btn" type="button">Rückgängig</button>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="card" aria-labelledby="h-desk">
          <div class="card-head">
            <h2 id="h-desk"><a class="link" href="/desks.html#music">Musikredaktion</a></h2>
            <span class="state-lamp" id="desk-lamp" data-state="idle">
              <span class="dot" aria-hidden="true"></span><span id="desk-lamp-label">…</span>
            </span>
          </div>
          <div id="desk-lines"></div>
        </section>

        <section class="card" aria-labelledby="h-log">
          <div class="card-head">
            <h2 id="h-log">Sendeprotokoll</h2>
            <span class="meta">neueste zuerst</span>
          </div>
          <ol class="log" id="player-log"></ol>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/broadcast.js"></script>
</body>
</html>
