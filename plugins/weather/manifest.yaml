name: get_weather
description: Liefert das aktuelle Wetter für einen Ort (Open-Meteo, kein API-Key nötig).
parameters:
  type: object
  properties:
    location:
      type: string
      description: Ortsname, z.B. "Berlin"
  required: [location]
enabled: true
# Runs automatically each loop with context_args below, result goes straight into the agent's
# input - no tool call needed. Still callable on demand for a different location.
context: true
context_args:
  location: "Berlin"
