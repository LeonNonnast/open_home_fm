[project]
name = "open-home-fm"
version = "0.1.0"
description = "Local, plugin-based radio agent for a Raspberry-Pi-hosted FM transmitter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "ollama>=0.3.3",
    "anthropic>=0.34",
    "spotipy>=2.24",
    "faster-whisper>=1.0",
    "rapidfuzz>=3.9",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# .venv/bin/pip install -e ".[dev]" && .venv/bin/pytest
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "shell: runs install.sh against throwaway git repos (needs git + bash)",
]
